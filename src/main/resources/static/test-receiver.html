<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>CRM — Test Receiver (dev only)</title>
  <script src="/js/twilio.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 420px; margin: 60px auto; padding: 24px; }
    h2  { color: #1e293b; margin-bottom: 4px; }
    p.subtitle { color: #64748b; font-size: 13px; margin-top: 0; }
    #status {
      padding: 14px 16px; border-radius: 8px;
      background: #f1f5f9; margin: 20px 0;
      font-size: 14px; line-height: 1.5;
    }
    .identity { font-size: 12px; color: #94a3b8; margin-bottom: 20px; }
    button {
      padding: 12px 28px; font-size: 15px;
      border: none; border-radius: 8px;
      cursor: pointer; margin-right: 8px;
    }
    #btnAnswer { background: #22c55e; color: #fff; display: none; }
    #btnHangup { background: #ef4444; color: #fff; display: none; }
    button:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <h2>Test Receiver</h2>
  <p class="subtitle">Outil de test dev — ne pas déployer en prod</p>

  <div id="status">Initialisation...</div>
  <div class="identity" id="identity"></div>

  <button id="btnAnswer">📞 Décrocher</button>
  <button id="btnHangup">📵 Raccrocher</button>

  <script src="/js/test-receiver.js"></script>
</body>
</html>
