# =============================================================================
# Actuator Configuration - CONFIGURATION PRINCIPALE
# =============================================================================
# IMPORTANT:
# - Port principal (API) : 8443 (HTTPS)
# - Port actuator (monitoring) : 8081 (HTTP, local uniquement)
# - Prometheus scrape : http://localhost:8081/actuator/prometheus
# =============================================================================

management:
  # Port séparé pour actuator (HTTP uniquement, pour Prometheus)
  server:
    port: 8081
    ssl:
      enabled: false  # Actuator en HTTP (monitoring local)

  # ===========================================================================
  # Endpoints Exposure
  # ===========================================================================
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - circuitbreakers
          - circuitbreakerevents
          - retries
          - retryevents
          - prometheus
      base-path: /actuator

  # ===========================================================================
  # Health Endpoint Configuration
  # ===========================================================================
  endpoint:
    health:
      show-details: when_authorized
      show-components: when_authorized
      probes:
        enabled: true

    # Circuit Breaker endpoints
    circuitbreakers:
      enabled: true
    circuitbreakerevents:
      enabled: true

  # ===========================================================================
  # Health Indicators
  # ===========================================================================
  health:
    circuitbreakers:
      enabled: true
    rabbit:
      enabled: true
    db:
      enabled: true
    mail:
      enabled: true

  # ===========================================================================
  # Metrics Configuration (Prometheus)
  # ===========================================================================
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name:CoreProject}
      environment: ${spring.profiles.active:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.75, 0.95, 0.99

---
# =============================================================================
# Development Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: dev

management:
  endpoints:
    web:
      exposure:
        include: "*"  # Tous les endpoints en dev
  endpoint:
    health:
      show-details: always
      show-components: always

---
# =============================================================================
# Production Profile
# =============================================================================
spring:
  config:
    activate:
      on-profile: prod

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: when_authorized