security:
  # Requires a valid (non self-signed) SSL certificate — disabled by default,
  # forced on for the prod profile below.
  hsts:
    enabled: false

  login-attempts:
    username:
      max-attempts: 5
      lockout-minutes: 15
    ip:
      max-attempts: 10
      lockout-minutes: 60
    combined:
      max-attempts: 3
      lockout-minutes: 5

---
spring:
  config:
    activate:
      on-profile: prod

security:
  hsts:
    enabled: true

