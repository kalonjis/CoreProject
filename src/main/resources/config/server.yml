server:
  port: ${APP_SERVER_SECURE_PORT} #HTTPS
  # Delegate X-Forwarded-For processing to Tomcat's RemoteIpValve.
  # Only trusts XFF from loopback (127.0.0.1, ::1) by default — i.e. nginx on the same VPS.
  # If nginx is on a separate server, add: server.tomcat.remoteip.trusted-proxies=<nginx-ip>
  forward-headers-strategy: native
  ssl:
    key-store: classpath:keystore.p12
    key-store-password: ${APP_SSL_PASSWORD}
    key-store-type: PKCS12
    key-alias: ${APP_SSL_KEY_ALIAS}

  # Configuration pour écouter sur le port 8080 aussi
  http:
    port: ${APP_SERVER_HTTP_PORT}

  # ========== GZIP Compression ==========
  compression:
    enabled: true
    mime-types:
      - application/json
      - application/xml
      - application/hal+json
      - text/html
      - text/xml
      - text/plain
    min-response-size: 1024  # Compresse uniquement si > 1KB