# =============================================================================
# Resilience4j Configuration
# =============================================================================
# Location: src/main/resources/config/resilience4j.yml
# =============================================================================

resilience4j:
  # ===========================================================================
  # Circuit Breaker Configuration
  # ===========================================================================
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        eventConsumerBufferSize: 100  # For event publisher

    instances:
      smtpBackend:
        baseConfig: default
        waitDurationInOpenState: 60s
        failureRateThreshold: 50

      twilioBackend:
        baseConfig: default
        waitDurationInOpenState: 30s  # Twilio recovers faster than SMTP
        failureRateThreshold: 50

      # Nominatim Geocoding Circuit Breaker
      # Longer wait duration due to potential rate limiting and API instability
      nominatimBackend:
        baseConfig: default
        waitDurationInOpenState: 120s  # 2 minutes - Nominatim may have longer outages
        failureRateThreshold: 60       # Slightly more tolerant (60% vs 50%)
        slowCallDurationThreshold: 8s  # 8s threshold (Nominatim can be slower)
        slidingWindowSize: 20          # Larger window for better statistics

    # Metrics configuration
    metrics:
      enabled: true
      legacy:
        enabled: false

  # ===========================================================================
  # Retry Configuration
  # ===========================================================================
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.mail.MailException
          - jakarta.mail.MessagingException
        ignoreExceptions:
          - be.steby.CoreProject.bll.common.exceptions.mail.MailException

      # Twilio-specific retry config
      twilioRetryConfig:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - com.twilio.exception.ApiConnectionException
          - com.twilio.exception.ApiException
        ignoreExceptions:
          - be.steby.CoreProject.bll.common.exceptions.phone.InvalidPhoneNumberFormatException

      # Nominatim-specific retry config
      nominatimRetryConfig:
        maxAttempts: 2                 # Only 1 retry
        waitDuration: 2s               # 2s wait (respects 1 req/sec rate limit)
        enableExponentialBackoff: false # Fixed delay to maintain rate limit compliance
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

    instances:
      smtpBackend:
        baseConfig: default
        maxAttempts: 3

      twilioBackend:
        baseConfig: twilioRetryConfig
        maxAttempts: 3

      nominatimBackend:
        baseConfig: nominatimRetryConfig
        maxAttempts: 2

    # Metrics configuration
    metrics:
      enabled: true
      legacy:
        enabled: false

  # ===========================================================================
  # Time Limiter Configuration (optional)
  # ===========================================================================
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true

    instances:
      smtpBackend:
        baseConfig: default
        timeoutDuration: 30s

      twilioBackend:
        baseConfig: default
        timeoutDuration: 15s  # Twilio API should respond faster

      nominatimBackend:
        baseConfig: default
        timeoutDuration: 10s  # Nominatim should respond within 10s (config is 5s + buffer)

    metrics:
      enabled: true

  # ===========================================================================
  # Bulkhead Configuration (optional - for thread isolation)
  # ===========================================================================
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0s

    instances:
      smtpBackend:
        baseConfig: default
        maxConcurrentCalls: 10

      twilioBackend:
        baseConfig: default
        maxConcurrentCalls: 15  # Twilio can handle more concurrent calls

      nominatimBackend:
        baseConfig: default
        maxConcurrentCalls: 1   # IMPORTANT: 1 call at a time (rate limit: 1 req/sec)
        maxWaitDuration: 5s     # Wait up to 5s for slot availability

    metrics:
      enabled: true

  # ===========================================================================
  # Rate Limiter Configuration (optional)
  # ===========================================================================
  ratelimiter:
    configs:
      default:
        limitRefreshPeriod: 1s
        limitForPeriod: 10
        timeoutDuration: 0s

    instances:
      smtpBackend:
        baseConfig: default
        limitForPeriod: 5  # 5 emails per second max

      twilioBackend:
        baseConfig: default
        limitForPeriod: 10  # 10 SMS per second max (Twilio limit depends on your plan)

      nominatimBackend:
        baseConfig: default
        limitForPeriod: 1    # CRITICAL: 1 request per second (Nominatim policy)
        limitRefreshPeriod: 1s
        timeoutDuration: 5s  # Wait up to 5s if rate limit reached

    metrics:
      enabled: true