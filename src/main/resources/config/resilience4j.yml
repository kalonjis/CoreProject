# =============================================================================
# Resilience4j Configuration
# =============================================================================
# Location: src/main/resources/config/resilience4j.yml
# =============================================================================

resilience4j:
  # ===========================================================================
  # Circuit Breaker Configuration
  # ===========================================================================
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 10s
        eventConsumerBufferSize: 100  # For event publisher

    instances:
      smtpBackend:
        baseConfig: default
        waitDurationInOpenState: 60s
        failureRateThreshold: 50

      # Future: Twilio SMS
      # twilioBackend:
      #   baseConfig: default
      #   waitDurationInOpenState: 30s

      # Future: Nominatim Geocoding
      # nominatimBackend:
      #   baseConfig: default
      #   waitDurationInOpenState: 120s

    # Metrics configuration
    metrics:
      enabled: true
      legacy:
        enabled: false

  # ===========================================================================
  # Retry Configuration
  # ===========================================================================
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.mail.MailException
          - jakarta.mail.MessagingException
        ignoreExceptions:
          - be.steby.CoreProject.bll.common.exceptions.mail.MailException

    instances:
      smtpBackend:
        baseConfig: default
        maxAttempts: 3

    # Metrics configuration
    metrics:
      enabled: true
      legacy:
        enabled: false

  # ===========================================================================
  # Time Limiter Configuration (optional)
  # ===========================================================================
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s
        cancelRunningFuture: true

    instances:
      smtpBackend:
        baseConfig: default
        timeoutDuration: 30s

    metrics:
      enabled: true

  # ===========================================================================
  # Bulkhead Configuration (optional - for thread isolation)
  # ===========================================================================
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 25
        maxWaitDuration: 0s

    instances:
      smtpBackend:
        baseConfig: default
        maxConcurrentCalls: 10

    metrics:
      enabled: true

  # ===========================================================================
  # Rate Limiter Configuration (optional)
  # ===========================================================================
  ratelimiter:
    configs:
      default:
        limitRefreshPeriod: 1s
        limitForPeriod: 10
        timeoutDuration: 0s

    instances:
      smtpBackend:
        baseConfig: default
        limitForPeriod: 5  # 5 emails per second max

    metrics:
      enabled: true