<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>We received your inquiry</title>
</head>
<body>
<h2>Thank you for contacting us!</h2>

<p>Dear <span th:text="${name}"></span>,</p>

<p>We have received your inquiry and will get back to you as soon as possible.</p>

<h3>Your inquiry details:</h3>
<ul>
    <li><strong>Reference:</strong> <span th:text="${referenceId}"></span></li>
    <li><strong>Subject:</strong> <span th:text="${subject}"></span></li>
    <li><strong>Category:</strong> <span th:text="${leadType}"></span></li>
</ul>

<p>Please keep your reference number for future correspondence.</p>

<p>Best regards,<br>The Team</p>
</body>
</html>
