spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import:
      - classpath:config/database.yml
      - classpath:config/ratelimiting.yml
      - classpath:config/mail.yml
      - classpath:config/phone.yml
      - classpath:config/cache-device.yml
      - classpath:config/cache-user.yml
      - classpath:config/server.yml
      - classpath:config/security/jwt.yml
      - classpath:config/security/oauth2.yml
      - classpath:config/security/tokens.yml
      - classpath:config/security/device.yml
      - classpath:config/security/emailaddress.yml
      - classpath:config/security/password.yml
      - classpath:config/security/account.yml
      - classpath:config/security/admin.yml
      - classpath:config/security/auth.yml
      - classpath:config/security/two-factor/totp.yml
      - classpath:config/security/two-factor/email.yml
      - classpath:config/security/two-factor/backup-codes.yml
      - classpath:config/common-validation.yml
      - classpath:config/logging.yml
      - classpath:config/geocoding.yml
      - classpath:config/resilience4j.yml
      - classpath:config/actuator.yml
      - classpath:config/storage.yml
      - classpath:config/lead.yml
      - classpath:config/support.yml
      - classpath:config/notification.yml
      - classpath:config/gdpr.yml
      - classpath:config/crm_webhooks.yml

url:
  back_server: ${URL_BACK_SERVER}
  front_server: ${URL_FRONT_SERVER}


# Configuration personnalisée pour les alertes
async:
  monitoring:
    alert-threshold:
      email-queue: 80        # Alerte si la file email > 80%
      log-queue: 90          # Alerte si la file logs > 90%
      general-queue: 70      # Alerte si la file générale > 70%
    metrics:
      enabled: true
      export-interval: 60s   # Export des métriques toutes les 60 secondes