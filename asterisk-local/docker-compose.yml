services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk-crm-local
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "8089:8089"
      - "10000-10099:10000-10099/udp"
    volumes:
      - ./config:/etc/asterisk
      - ./keys:/etc/asterisk/keys
    restart: unless-stopped
