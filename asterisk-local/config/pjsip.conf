; ── Transport WebSocket plain (browser → Asterisk, local dev sans TLS) ───
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

; ── Transport WebSocket sécurisé (browser → Asterisk) ─────────────────────
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
cert_file=/etc/asterisk/keys/asterisk.crt
priv_key_file=/etc/asterisk/keys/asterisk.key

; ── Extension 1001 (commercial CRM) ──────────────────────────────────────
[1001]
type=endpoint
transport=transport-ws
context=from-internal
disallow=all
allow=opus
allow=ulaw
webrtc=yes
dtls_cert_file=/etc/asterisk/keys/asterisk.crt
dtls_private_key=/etc/asterisk/keys/asterisk.key
dtls_verify=fingerprint
dtls_setup=actpass
ice_support=yes
auth=auth-1001
aors=1001

[auth-1001]
type=auth
auth_type=userpass
username=1001
password=test1234

[1001]
type=aor
max_contacts=1
remove_existing=yes

