[from-internal]

; ── Test echo : le commercial entend sa propre voix ──────────────────────
exten => echo,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Echo()
 same => n,Hangup()

; ── Appel entre les deux extensions locales ──────────────────────────────
exten => 1001,1,Dial(PJSIP/1001,30)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,30)
 same => n,Hangup()

; ── Catch-all : numéros non routables (pas de trunk PSTN en dev) ─────────
; _[+0-9]. matche aussi les numéros E.164 qui commencent par '+'.
; Busy() envoie 486 Busy Here → SIP.js fire Terminated → le widget se ferme.
exten => _[+0-9].,1,Busy()
 same => n,Hangup()
